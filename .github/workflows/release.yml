    steps:
      - uses: docker/build-push-action@v6
        with:
          context: web/storefront
          file: web/storefront/Dockerfile
          tags: ghcr.io/hesham-73/harborline-storefront:2.3.0
  publish:
    needs: [build-gateway, build-catalog, build-checkout, build-inventory, build-payments, build-shipping, build-identity, build-notifications, build-search, build-billing, build-fraud, build-media, build-storefront]
    runs-on: ubuntu-latest
    steps:
      - run: echo "record manifest 2.3.0"
