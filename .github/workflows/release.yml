name: Harborline release
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "compile contracts, services, and storefront"
  build-gateway:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/build-push-action@v6
        with:
          context: services/gateway
          file: services/gateway/Dockerfile
          tags: ghcr.io/hesham-73/harborline-gateway:2.3.0

  build-catalog:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
