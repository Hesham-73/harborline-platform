apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: harborline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: ghcr.io/hesham-73/harborline-inventory:2.3.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: inventory-config
            - secretRef:
                name: inventory-identity
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: harborline
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: harborline
data:
  SERVICE_NAME: inventory
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-identity
  namespace: harborline
stringData:
  token: SAMPLE_VALUE_NOT_A_REAL_SECRET
