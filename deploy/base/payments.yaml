apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: harborline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: ghcr.io/hesham-73/harborline-payments:2.3.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payments-config
            - secretRef:
                name: payments-identity
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: harborline
spec:
  selector:
    app: payments
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: harborline
data:
  SERVICE_NAME: payments
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-identity
  namespace: harborline
stringData:
  token: SAMPLE_VALUE_NOT_A_REAL_SECRET
