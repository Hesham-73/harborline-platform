apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: harborline
spec:
  serviceName: postgres
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: harborline
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: harborline
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: harborline
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.1
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: harborline
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: v1
kind: Namespace
metadata:
  name: harborline
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-preview
  namespace: harborline
spec:
  selector:
    app: ledger-preview
  ports:
    - port: 80
