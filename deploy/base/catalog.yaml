apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: harborline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: ghcr.io/hesham-73/harborline-catalog:2.3.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalog-config
            - secretRef:
                name: catalog-identity
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: harborline
spec:
  selector:
    app: catalog
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: harborline
data:
  SERVICE_NAME: catalog
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-identity
  namespace: harborline
stringData:
  token: SAMPLE_VALUE_NOT_A_REAL_SECRET
