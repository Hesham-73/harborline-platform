apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: harborline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      containers:
        - name: shipping
          image: ghcr.io/hesham-73/harborline-shipping:2.3.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shipping-config
            - secretRef:
                name: shipping-identity
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: harborline
spec:
  selector:
    app: shipping-shifted
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping-config
  namespace: harborline
data:
  SERVICE_NAME: shipping
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: shipping-identity
  namespace: harborline
stringData:
  token: SAMPLE_VALUE_NOT_A_REAL_SECRET
