apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-gateway
  namespace: harborline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chart-gateway
  template:
    metadata:
      labels:
        app: chart-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/hesham-73/harborline-gateway:2.3.0
---
apiVersion: v1
kind: Service
metadata:
  name: chart-gateway
  namespace: harborline
spec:
  selector:
    app: chart-gateway
  ports:
    - port: 80
